<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0C0B0A;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; }

  /* ── Left panel ── */
  .left {
    width: 630px;
    padding: 64px 72px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 2;
  }
  .top { }
  .red-rule {
    width: 44px;
    height: 2.5px;
    background: #C73A1C;
    margin-bottom: 28px;
  }
  .kicker {
    font-family: "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #C73A1C;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .name {
    font-size: 80px;
    font-weight: 700;
    line-height: 0.95;
    color: #ECE8E0;
    letter-spacing: -0.025em;
    margin-bottom: 28px;
  }
  .tagline {
    font-size: 17px;
    color: #666;
    line-height: 1.55;
    max-width: 430px;
  }
  .tagline em {
    color: #999;
    font-style: normal;
  }
  .bottom {
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .domain {
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: #666;
  }
  .dot-sep {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #555;
  }
  .byline {
    font-family: "Courier New", monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #555;
  }

  /* ── Divider ── */
  .divider {
    width: 0.5px;
    background: rgba(255,255,255,0.05);
    align-self: stretch;
  }

  /* ── Right panel ── */
  .right {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* background grain texture */
  .right::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 60% 50%, rgba(199,58,28,0.05) 0%, transparent 65%),
                radial-gradient(ellipse at 90% 20%, rgba(230,161,48,0.04) 0%, transparent 50%);
  }

  .chart-wrap {
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>

  <div class="left">
    <div class="top">
      <div class="red-rule"></div>
      <div class="kicker">— Portfolio · 2025</div>
      <div class="name">Ron<br>Poznansky</div>
      <div class="tagline">
        UX Researcher · <em>behavioral systems,<br>
        mixed methods, product decision-making</em>
      </div>
    </div>
    <div class="bottom">
      <div class="domain">ronpaz.com</div>
      <div class="dot-sep"></div>
      <div class="byline">San Francisco, CA</div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="right">
    <div class="chart-wrap">
      <!-- Scatter plot: negative correlation, ghosted -->
      <svg width="480" height="400" viewBox="0 0 480 400" xmlns="http://www.w3.org/2000/svg">

        <!-- Outer frame / subtle border -->
        <rect x="48" y="24" width="400" height="322" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>

        <!-- Grid lines horizontal -->
        <line x1="48" y1="24"  x2="448" y2="24"  stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
        <line x1="48" y1="131" x2="448" y2="131" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="3 4"/>
        <line x1="48" y1="238" x2="448" y2="238" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="3 4"/>
        <line x1="48" y1="346" x2="448" y2="346" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

        <!-- Grid lines vertical -->
        <line x1="181" y1="24" x2="181" y2="346" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" stroke-dasharray="3 4"/>
        <line x1="314" y1="24" x2="314" y2="346" stroke="rgba(255,255,255,0.03)" stroke-width="0.5" stroke-dasharray="3 4"/>
        <line x1="448" y1="24" x2="448" y2="346" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>

        <!-- Y axis labels -->
        <text x="38" y="28"  text-anchor="end" font-family="Courier New" font-size="9" fill="#333">$60</text>
        <text x="38" y="135" text-anchor="end" font-family="Courier New" font-size="9" fill="#333">$40</text>
        <text x="38" y="242" text-anchor="end" font-family="Courier New" font-size="9" fill="#333">$20</text>
        <text x="38" y="350" text-anchor="end" font-family="Courier New" font-size="9" fill="#333">$0</text>

        <!-- X axis labels -->
        <text x="48"  y="364" text-anchor="middle" font-family="Courier New" font-size="9" fill="#333">0%</text>
        <text x="181" y="364" text-anchor="middle" font-family="Courier New" font-size="9" fill="#333">5%</text>
        <text x="314" y="364" text-anchor="middle" font-family="Courier New" font-size="9" fill="#333">10%</text>
        <text x="448" y="364" text-anchor="middle" font-family="Courier New" font-size="9" fill="#333">15%</text>

        <!-- Regression trend line (very subtle) -->
        <line x1="48" y1="55" x2="448" y2="330" stroke="rgba(100,130,210,0.12)" stroke-width="1.5" stroke-dasharray="4 3"/>

        <!-- Scatter dots — negative correlation cluster, ghosted navy -->
        <circle cx="70"  cy="60"  r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="103" cy="82"  r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="124" cy="99"  r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="138" cy="106" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="157" cy="116" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="165" cy="111" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="175" cy="125" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="192" cy="148" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="204" cy="155" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="218" cy="165" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="228" cy="168" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="240" cy="177" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="262" cy="186" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="282" cy="190" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="308" cy="214" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="350" cy="222" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>
        <circle cx="393" cy="232" r="5.5" fill="#2A4A8A" fill-opacity="0.55"/>

        <!-- Axes -->
        <line x1="48" y1="24"  x2="48"  y2="346" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
        <line x1="48" y1="346" x2="448" y2="346" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>

        <!-- Chart title label -->
        <text x="48" y="14" font-family="Courier New" font-size="8.5" fill="#2A2A2A" letter-spacing="0.12em" text-transform="uppercase">CREDITS GRANTED DAILY vs. CREDIT RISK MODEL DRIFT</text>

        <!-- Axis titles -->
        <text x="9" y="185" transform="rotate(-90, 9, 185)" text-anchor="middle" font-family="Courier New" font-size="7.5" fill="#2A2A2A" letter-spacing="0.1em">CREDITS GRANTED DAILY</text>
        <text x="248" y="386" text-anchor="middle" font-family="Courier New" font-size="7.5" fill="#2A2A2A" letter-spacing="0.1em">CREDIT RISK MODEL: DRIFT</text>

      </svg>
    </div>
  </div>

</body>
</html>
